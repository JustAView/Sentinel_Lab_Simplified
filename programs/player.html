<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safe Player — Sentinel Lab</title><style>
:root{--bg:#0a1118;--panel:#101b24;--line:#22323d;--text:#edf5f5;--muted:#81939d;--teal:#65e4c1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}main{max-width:900px;margin:40px auto;padding:0 20px}.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:42px;height:42px;border-radius:12px;background:#173b35;color:var(--teal);display:grid;place-items:center;font-size:22px}h1{font-size:25px;margin:0}p{color:var(--muted);line-height:1.6}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}input,textarea,button{font:inherit;border-radius:8px;padding:11px;border:1px solid #30454c;background:#0c171e;color:var(--text)}input,textarea{width:100%;margin:7px 0 12px}button,.go{background:var(--teal);color:#09201e;border:0;font-weight:700;cursor:pointer;padding:11px 15px;text-decoration:none;display:inline-block}.muted{font-size:12px;color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}video,audio{width:100%;margin-top:15px}a{color:var(--teal)}li{padding:8px;border-bottom:1px solid var(--line)}
</style></head><body><main><div class="top"><div class="logo">▶</div><div><h1>Safe Player</h1><div class="muted">Sentinel Lab · учебное приложение</div></div></div><div class="card"><p>Выберите аудио- или видеофайл на своём компьютере. Файл не загружается на сервер стенда.</p><input id="pick" type="file" accept="audio/*,video/*"><video id="video" controls hidden></video><audio id="audio" controls hidden></audio><p id="info" class="muted"></p></div><script>let old;document.getElementById('pick').onchange=e=>{let f=e.target.files[0];if(!f)return;if(old)URL.revokeObjectURL(old);old=URL.createObjectURL(f);let v=document.getElementById('video'),a=document.getElementById('audio');v.hidden=a.hidden=true;if(f.type.startsWith('video/')){v.src=old;v.hidden=false}else if(f.type.startsWith('audio/')){a.src=old;a.hidden=false}else{document.getElementById('info').textContent='Выбранный файл не распознан как аудио или видео.';return}document.getElementById('info').textContent=f.name+' · '+Math.round(f.size/1024)+' КБ'};</script></main></body></html>
